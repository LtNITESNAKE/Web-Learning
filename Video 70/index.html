<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 43px;
        margin-top: 45px;
        padding-top: 225px;
    }
    .box{
      
        height: 45px;
        width: 45px;
        border: 2px solid black;
    }
</style>
<body>

    <div class="container">
        <div class="box" >Boxes 1</div>
        <div class="box">Boxes 2</div>
        <div class="box" id="red">Boxes 3</div>
        <div class="box">Boxes 4</div>
        <div class="box">Boxes 5</div>
    </div>
    
    <script>
let boxes = document.getElementsByClassName("box")
boxes[4].style.backgroundColor = "red"

// document.querySelectorAll(".box").forEach(e =>
//     e.style.backgroundColor = "green"
// )

document.getElementById("red").style.backgroundColor = "purple"

document.querySelector(".box").style.backgroundColor = "yellow"

let div = document.getElementsByTagName("div")

div[2].style.backgroundColor = "orange"

document.body.childNodes[1].childNodes[7].style.backgroundColor = "lightblue"


    </script>
</body>
</html>
