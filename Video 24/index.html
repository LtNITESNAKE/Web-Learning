<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Shadows and Outlines</title>
    <style>
        .box{
border: 2px solid black;
padding: 34px;
box-shadow: 5px 5px 15px 5px #888888;

        }
        .text-element {
             text-shadow: 2px 2px 4px #d92929; 
             outline: 2px solid blue;
             outline-offset: 3px;
             border:2px solid black;
             border-radius: 8px;
            }
    </style>
</head>
<body>
    <div class="box">i am a box</div>
    <p class="text-element">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem nihil sit libero expedita, incidunt magnam reprehenderit quo officiis facilis nobis pariatur molestias deleniti earum saepe omnis eum nemo eveniet? Eveniet!</p>
    
</body>
</html>
